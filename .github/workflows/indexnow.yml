name: Notify IndexNow after Pages deploy

on:
  workflow_run:
    workflows: ["Deploy Harumverso to GitHub Pages"]
    types: [completed]

permissions:
  contents: read

jobs:
  notify:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout deployed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2
      - name: Build changed URL payload
        run: python3 scripts/indexnow_payload.py > /tmp/indexnow.json
      - name: Notify IndexNow
        run: |
          echo "Submitting URLs:"
          cat /tmp/indexnow.json
          curl --fail-with-body --retry 2 --retry-delay 3 \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data-binary @/tmp/indexnow.json \
            https://api.indexnow.org/indexnow
