name: Harum Noir Mobile Visual Audit · GitHub Pages

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/noir-mobile-visual-audit.yml"

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.50.1 --no-save
          npx playwright install --with-deps chromium

      - name: Capture post-patch mobile matrix
        run: |
          mkdir -p screenshots
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const viewports = [
              { name: '360x800', width: 360, height: 800 },
              { name: '390x844', width: 390, height: 844 },
              { name: '412x915', width: 412, height: 915 }
            ];
            const base = 'https://suryamayaharum-droid.github.io/astro-blog-starter-template';
            const targets = [
              ['home', `${base}/`],
              ['atlas', `${base}/referencias/`],
              ['artist-cesar-santos', `${base}/referencias/cesar-santos/`],
              ['artist-silvie-mahdal', `${base}/referencias/silvie-mahdal/`],
              ['percursos', `${base}/percursos/`]
            ];
            const metrics = [];

            for (const vp of viewports) {
              const dir = path.join('screenshots', vp.name);
              fs.mkdirSync(dir, { recursive: true });
              const context = await browser.newContext({
                viewport: { width: vp.width, height: vp.height },
                deviceScaleFactor: 1,
                isMobile: true,
                hasTouch: true,
                locale: 'pt-BR'
              });
              const page = await context.newPage();

              for (const [name, url] of targets) {
                const response = await page.goto(url, { waitUntil: 'networkidle', timeout: 45000 });
                await page.waitForTimeout(1200);

                const info = await page.evaluate(() => {
                  const root = document.documentElement;
                  const body = document.body;
                  const nav = document.querySelector('nav');
                  const hero = document.querySelector('.profileHero,.profile-hero,.streamHero,.stream-hero,.hero,.page-hero');
                  const rect = el => el ? (() => {
                    const r = el.getBoundingClientRect();
                    return { x:r.x, y:r.y, width:r.width, height:r.height, right:r.right, bottom:r.bottom };
                  })() : null;
                  return {
                    viewport: [window.innerWidth, window.innerHeight],
                    documentWidth: root.scrollWidth,
                    bodyWidth: body ? body.scrollWidth : null,
                    horizontalOverflow: root.scrollWidth > window.innerWidth + 1,
                    nav: rect(nav),
                    hero: rect(hero),
                    title: document.title
                  };
                });

                metrics.push({
                  viewport: vp.name,
                  route: name,
                  url,
                  status: response ? response.status() : null,
                  ...info
                });

                await page.screenshot({
                  path: path.join(dir, name + '.png'),
                  fullPage: false
                });
              }
              await context.close();
            }

            fs.writeFileSync('screenshots/metrics.json', JSON.stringify(metrics, null, 2));
            console.log(JSON.stringify(metrics, null, 2));
            await browser.close();
          })().catch(err => { console.error(err); process.exit(1); });
          NODE

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: harum-noir-mobile-audit-matrix
          path: screenshots
          if-no-files-found: error
          retention-days: 7
