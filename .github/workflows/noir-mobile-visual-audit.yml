name: Harum Noir Mobile Visual Audit · GitHub Pages

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy HARUM NOIR to GitHub Pages"]
    types: [completed]

permissions:
  contents: read

jobs:
  capture:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.50.1 --no-save
          npx playwright install --with-deps chromium

      - name: Capture mobile route matrix
        run: |
          mkdir -p screenshots
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const viewports = [
              { name: '320x568', width: 320, height: 568 },
              { name: '360x800', width: 360, height: 800 },
              { name: '390x844', width: 390, height: 844 },
              { name: '412x915', width: 412, height: 915 }
            ];
            const base = 'https://suryamayaharum-droid.github.io/astro-blog-starter-template';
            const targets = [
              ['home', `${base}/`],
              ['school', `${base}/escola/`],
              ['hands', `${base}/maos/`],
              ['body-relation', `${base}/corpo-em-relacao/`],
              ['head-expression', `${base}/cabeca-expressao/`],
              ['radar', `${base}/radar/`],
              ['colecoes', `${base}/colecoes/`],
              ['colecao-lugares', `${base}/colecoes/lugares/`],
              ['colecao-lugares-en', `${base}/en/collections/places/`, false],
              ['colecao-lugares-es', `${base}/es/colecciones/lugares/`, false],
              ['estudo-tonal', `${base}/colecoes/estudo-tonal/`],
              ['figure-gesture-pt', `${base}/colecoes/gesto-figura/`],
              ['figure-gesture-en', `${base}/en/collections/figure-gesture/`, false],
              ['figure-gesture-es', `${base}/es/colecciones/gesto-figura/`, false],
              ['tonal-study-en', `${base}/en/collections/tonal-study/`, false],
              ['tonal-study-es', `${base}/es/colecciones/estudio-tonal/`, false],
              ['english-school', `${base}/en/school/`],
              ['spanish-school', `${base}/es/escuela/`],
              ['atlas', `${base}/atlas/`],
              ['buscar', `${base}/buscar/`],
              ['busca', `${base}/busca/`],
              ['bancos', `${base}/bancos/`],
              ['composicoes-autorais', `${base}/composicoes-autorais/`],
              ['museus', `${base}/museus/`],
              ['referencias', `${base}/referencias/`],
              ['biblioteca', `${base}/biblioteca/`],
              ['historia', `${base}/historia-da-arte/`],
              ['percursos', `${base}/percursos/`],
              ['cadernos', `${base}/cadernos/`],
              ['caderno-memoria', `${base}/cadernos/memoria/`],
              ['atelier', `${base}/atelier/`],
              ['ritual-do-carvao', `${base}/ritual-do-carvao/`],
              ['alunos', `${base}/alunos/`],
              ['temporadas', `${base}/temporadas/`],
              ['noir', `${base}/noir/`],
              ['outliers', `${base}/outliers/`],
              ['carta', `${base}/carta/`],
              ['metodo', `${base}/roubar-como-artista/`],
              ['arquivo', `${base}/arquivo/`],
              ['sobre', `${base}/sobre/`],
              ['artist-cesar-santos', `${base}/referencias/cesar-santos/`],
              ['collections-en', `${base}/en/collections/`, false],
              ['collections-es', `${base}/es/colecciones/`, false],
              ['home-en', `${base}/en/`, false],
              ['home-es', `${base}/es/`, false],
              ['about-en', `${base}/en/about/`, false],
              ['about-es', `${base}/es/acerca/`, false],
              ['art-history-en', `${base}/en/art-history/`, false],
              ['art-history-es', `${base}/es/historia-del-arte/`, false],
              ['brazil-visual-culture-en', `${base}/en/brazilian-visual-culture/`, false],
              ['brazil-visual-culture-es', `${base}/es/cultura-visual-brasilena/`, false],
              ['drawing-en', `${base}/en/drawing/`, false],
              ['drawing-es', `${base}/es/dibujo/`, false],
              ['museums-en', `${base}/en/museums/`, false],
              ['museums-es', `${base}/es/museos/`, false],
              ['references-en', `${base}/en/references/`, false],
              ['references-es', `${base}/es/referencias/`, false],
              ['tattoo-salvador-en', `${base}/en/tattoo-salvador/`, false],
              ['tattoo-salvador-es', `${base}/es/tatuaje-salvador/`, false],
              ['drawing-pt', `${base}/desenho/`, false],
              ['brazil-visual-culture-pt', `${base}/cultura-visual-brasileira/`, false],
              ['tattoo-salvador-pt', `${base}/tatuagem-salvador/`, false]
            ];
            const metrics = [];

            for (const vp of viewports) {
              const dir = path.join('screenshots', vp.name);
              fs.mkdirSync(dir, { recursive: true });
              const context = await browser.newContext({
                viewport: { width: vp.width, height: vp.height },
                deviceScaleFactor: 1,
                isMobile: true,
                hasTouch: true,
                locale: 'pt-BR'
              });
              const page = await context.newPage();
              let consoleErrors = [];
              let failedResources = [];
              page.on('console', msg => {
                if (msg.type() !== 'error') return;
                const text = msg.text();
                // YouTube embeds may request the experimental Compute Pressure API.
                // Chromium reports the browser-level Permissions Policy denial as an
                // error even when the HARUM NOIR page and player render normally.
                if (text === 'Permissions policy violation: compute-pressure is not allowed in this document.') return;
                consoleErrors.push(text);
              });
              page.on('response', response => {
                if (response.status() >= 400) {
                  failedResources.push({ status: response.status(), url: response.url() });
                }
              });

              for (const [name, url, requiresDock = true] of targets) {
                consoleErrors = [];
                failedResources = [];
                const response = await page.goto(url, { waitUntil: 'networkidle', timeout: 45000 });
                await page.waitForTimeout(700);

                const info = await page.evaluate(() => {
                  const root = document.documentElement;
                  const body = document.body;
                  const nav = document.querySelector('nav');
                  const dock = document.querySelector('.mobile-dock');
                  const hero = document.querySelector('.browse-hero,.profileHero,.profile-hero,.streamHero,.stream-hero,.hero,.page-hero');
                  const rect = el => el ? (() => {
                    const r = el.getBoundingClientRect();
                    return { x:r.x, y:r.y, width:r.width, height:r.height, right:r.right, bottom:r.bottom };
                  })() : null;
                  const actuallyVisible = el => {
                    for (let node = el; node && node.nodeType === 1; node = node.parentElement) {
                      if (node.hasAttribute('hidden') || node.hasAttribute('inert') || node.getAttribute('aria-hidden') === 'true') return false;
                      const style = getComputedStyle(node);
                      if (style.display === 'none' || style.visibility === 'hidden' || Number(style.opacity || 1) === 0) return false;
                      if (node.tagName === 'DETAILS' && !node.open && !el.closest('summary')) return false;
                    }
                    const r = el.getBoundingClientRect();
                    return r.width > 0 && r.height > 0;
                  };
                  return {
                    viewport: [window.innerWidth, window.innerHeight],
                    documentWidth: root.scrollWidth,
                    bodyWidth: body ? body.scrollWidth : null,
                    horizontalOverflow: root.scrollWidth > window.innerWidth + 1,
                    textLength: body ? body.innerText.trim().length : 0,
                    nav: rect(nav),
                    dock: rect(dock),
                    dockVisible: !!dock && getComputedStyle(dock).display !== 'none',
                    dockOcclusions: (() => {
                      if (!dock) return [];
                      const dr = dock.getBoundingClientRect();
                      return [...document.querySelectorAll('a[href],button,input,select,textarea')]
                        .filter(el => !dock.contains(el))
                        .map(el => {
                          const r = el.getBoundingClientRect();
                          const ih = Math.max(0, Math.min(r.bottom, dr.bottom) - Math.max(r.top, dr.top));
                          const iw = Math.max(0, Math.min(r.right, dr.right) - Math.max(r.left, dr.left));
                          const area = Math.max(1, r.width * r.height);
                          const overlapRatio = (ih * iw) / area;
                          return {
                            tag: el.tagName,
                            text: (el.textContent || el.getAttribute('aria-label') || '').trim().slice(0,80),
                            overlapRatio,
                            visible: actuallyVisible(el)
                          };
                        })
                        .filter(x => x.visible && x.overlapRatio > .25);
                    })(),
                    hero: rect(hero),
                    title: document.title,
                    brokenImages: [...document.images].filter(img => img.complete && img.naturalWidth === 0).map(img => img.currentSrc || img.src),
                    criticalTouchTargets: [...document.querySelectorAll('.save-current,.search-prompts button,.compare-toggle,.compare-card button,.school-clear,.school-intl-header nav a,.explore-menu summary,.explore-panel a,.intl-header nav a,.ih-header nav a,.ih-topics a,.intl-lesson-header a,.btn')]
                      .filter(el => {
                        return actuallyVisible(el);
                      })
                      .map(el => {
                        const r = el.getBoundingClientRect();
                        return { text:(el.textContent || el.getAttribute('aria-label') || '').trim().slice(0,80), width:r.width, height:r.height };
                      })
                  };
                });

                metrics.push({
                  viewport: vp.name,
                  route: name,
                  url,
                  requiresDock,
                  status: response ? response.status() : null,
                  consoleErrors: [...consoleErrors],
                  failedResources: [...failedResources],
                  ...info
                });

                await page.screenshot({
                  path: path.join(dir, name + '.png'),
                  fullPage: false
                });
              }
              await context.close();
            }

            fs.writeFileSync('screenshots/metrics.json', JSON.stringify(metrics, null, 2));
            console.log(JSON.stringify(metrics, null, 2));

            const failures = metrics.filter(m => {
              const sameOriginResourceFailures = (m.failedResources || []).filter(r => {
                try { return new URL(r.url).origin === new URL(m.url).origin; } catch { return true; }
              });
              return (
                !m.status ||
                m.status >= 400 ||
                m.horizontalOverflow ||
                !m.nav ||
                (m.requiresDock && !m.dockVisible) ||
                m.textLength < 40 ||
                (m.brokenImages && m.brokenImages.length > 0) ||
                (m.dockOcclusions && m.dockOcclusions.length > 0) ||
                (m.criticalTouchTargets && m.criticalTouchTargets.some(x => x.width < 44 || x.height < 44)) ||
                sameOriginResourceFailures.length > 0 ||
                (m.consoleErrors && m.consoleErrors.length > 0)
              );
            });

            fs.writeFileSync('screenshots/failures.json', JSON.stringify(failures, null, 2));
            fs.writeFileSync('screenshots/summary.json', JSON.stringify({
              generatedAt: new Date().toISOString(),
              routes: targets.length,
              viewports: viewports.length,
              checks: metrics.length,
              failures: failures.length
            }, null, 2));

            if (failures.length) {
              console.error('MOBILE_AUDIT_FAILURES');
              console.error(JSON.stringify(failures, null, 2));
              await browser.close();
              process.exit(1);
            }

            await browser.close();
          })().catch(err => { console.error(err); process.exit(1); });
          NODE

      - name: Ritual pre-launch commerce contract
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const base = 'https://suryamayaharum-droid.github.io/astro-blog-starter-template';
            const context = await browser.newContext({
              viewport: { width: 390, height: 844 },
              isMobile: true,
              hasTouch: true,
              locale: 'pt-BR',
              reducedMotion: 'reduce'
            });
            const page = await context.newPage();
            const failures = [];

            let response = await page.goto(base + '/ritual-do-carvao/', { waitUntil:'networkidle', timeout:45000 });
            const ritual = await page.evaluate(() => ({
              text: document.body?.innerText || '',
              links: [...document.querySelectorAll('a[href]')].map(a => a.href)
            }));
            if (!response || response.status() >= 400) failures.push({route:'ritual-do-carvao',reason:'http',status:response?.status()});
            if (!ritual.text.includes('A compra ainda não está aberta.')) failures.push({route:'ritual-do-carvao',reason:'prelaunch-status-missing'});
            const externalHotmart = ritual.links.filter(href => /hotmart\.com/i.test(href));
            if (externalHotmart.length) failures.push({route:'ritual-do-carvao',reason:'premature-hotmart-link',links:externalHotmart});

            response = await page.goto(base + '/alunos/', { waitUntil:'networkidle', timeout:45000 });
            const students = await page.evaluate(() => ({
              text: document.body?.innerText || '',
              links: [...document.querySelectorAll('a[href]')].map(a => a.href)
            }));
            if (!response || response.status() >= 400) failures.push({route:'alunos',reason:'http',status:response?.status()});
            if (!students.links.some(href => href.startsWith('https://consumer.hotmart.com/'))) failures.push({route:'alunos',reason:'student-hotmart-entry-missing'});
            if (!students.text.includes('O Ritual do Carvão ainda está em preparação.')) failures.push({route:'alunos',reason:'ritual-status-mismatch'});

            await context.close();
            await browser.close();
            if (failures.length) {
              console.error('RITUAL_COMMERCE_CONTRACT_FAILURES');
              console.error(JSON.stringify(failures,null,2));
              process.exit(1);
            }
            console.log('Ritual pre-launch commerce contract: OK');
          })().catch(err => { console.error(err); process.exit(1); });
          NODE

      - name: International mobile smoke
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const base = 'https://suryamayaharum-droid.github.io/astro-blog-starter-template';
            const routes = [
              { path:'/en/', lang:'en' },
              { path:'/en/about/', lang:'en' },
              { path:'/en/references/', lang:'en' },
              { path:'/en/museums/', lang:'en' },
              { path:'/en/drawing/', lang:'en' },
              { path:'/en/art-history/', lang:'en' },
              { path:'/en/brazilian-visual-culture/', lang:'en' },
              { path:'/en/tattoo-salvador/', lang:'en' },
              { path:'/es/', lang:'es' },
              { path:'/es/acerca/', lang:'es' },
              { path:'/es/referencias/', lang:'es' },
              { path:'/es/museos/', lang:'es' },
              { path:'/es/dibujo/', lang:'es' },
              { path:'/es/historia-del-arte/', lang:'es' },
              { path:'/es/cultura-visual-brasilena/', lang:'es' },
              { path:'/es/tatuaje-salvador/', lang:'es' }
            ];
            const failures = [];
            const context = await browser.newContext({
              viewport: { width: 390, height: 844 },
              deviceScaleFactor: 1,
              isMobile: true,
              hasTouch: true,
              locale: 'en-US',
              reducedMotion: 'reduce'
            });
            const page = await context.newPage();

            for (const route of routes) {
              const failedResources = [];
              page.removeAllListeners('response');
              page.on('response', response => {
                if (response.status() >= 400) {
                  try {
                    if (new URL(response.url()).origin === new URL(base).origin) {
                      failedResources.push({status:response.status(),url:response.url()});
                    }
                  } catch {}
                }
              });
              const response = await page.goto(base + route.path, { waitUntil:'networkidle', timeout:45000 });
              await page.waitForTimeout(250);
              const result = await page.evaluate(() => ({
                lang: document.documentElement.lang,
                overflow: document.documentElement.scrollWidth > window.innerWidth + 1,
                textLength: document.body?.innerText.trim().length || 0,
                title: document.title,
                viewport: [window.innerWidth, window.innerHeight]
              }));
              if (!response || response.status() >= 400) failures.push({route,reason:'http',status:response?.status()});
              if (result.lang !== route.lang) failures.push({route,reason:'lang',result});
              if (result.overflow) failures.push({route,reason:'overflow',result});
              if (result.textLength < 200) failures.push({route,reason:'thin-content',result});
              if (!result.title) failures.push({route,reason:'missing-title'});
              if (failedResources.length) failures.push({route,reason:'same-origin-resource',failedResources});
            }

            await context.close();
            await browser.close();
            console.log('International mobile smoke:', routes.length, 'routes checked');
            if (failures.length) {
              console.error('INTERNATIONAL_MOBILE_FAILURES');
              console.error(JSON.stringify(failures,null,2));
              process.exit(1);
            }
          })().catch(err => { console.error(err); process.exit(1); });
          NODE

      - name: Responsive boundary smoke
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const base = 'https://suryamayaharum-droid.github.io/astro-blog-starter-template';
            const routes = ['/', '/atlas/', '/biblioteca/', '/maos/', '/corpo-em-relacao/', '/cabeca-expressao/', '/radar/', '/buscar/', '/ritual-do-carvao/', '/alunos/'];
            const widths = [
              { name: 'mobile-edge', width: 760, expectDock: true },
              { name: 'desktop-edge', width: 761, expectDock: false },
              { name: 'tablet', width: 1024, expectDock: false }
            ];
            const failures = [];

            for (const cfg of widths) {
              const context = await browser.newContext({
                viewport: { width: cfg.width, height: 900 },
                hasTouch: cfg.width <= 760,
                isMobile: cfg.width <= 760,
                locale: 'pt-BR',
                reducedMotion: 'reduce'
              });
              const page = await context.newPage();

              for (const route of routes) {
                const response = await page.goto(base + route, { waitUntil: 'networkidle', timeout: 45000 });
                await page.waitForTimeout(250);
                const result = await page.evaluate(() => {
                  const dock = document.querySelector('.mobile-dock');
                  const dockVisible = !!dock && getComputedStyle(dock).display !== 'none';
                  const overflow = document.documentElement.scrollWidth > window.innerWidth + 1;
                  const minDockTarget = dock ? Math.min(...[...dock.querySelectorAll('a')].map(a => a.getBoundingClientRect().height)) : null;
                  return {
                    dockVisible,
                    overflow,
                    minDockTarget,
                    scrollBehavior: getComputedStyle(document.documentElement).scrollBehavior
                  };
                });
                if (!response || response.status() >= 400) failures.push({cfg, route, reason:'http', status:response?.status()});
                if (result.overflow) failures.push({cfg, route, reason:'overflow'});
                if (result.dockVisible !== cfg.expectDock) failures.push({cfg, route, reason:'dock-state', result});
                if (cfg.expectDock && result.minDockTarget !== null && result.minDockTarget < 44) failures.push({cfg, route, reason:'dock-touch-target', result});
                if (result.scrollBehavior === 'smooth') failures.push({cfg, route, reason:'reduced-motion-scroll', result});
              }
              await context.close();
            }

            await browser.close();
            if (failures.length) {
              console.error('RESPONSIVE_BOUNDARY_FAILURES');
              console.error(JSON.stringify(failures, null, 2));
              process.exit(1);
            }
          })().catch(err => { console.error(err); process.exit(1); });
          NODE

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harum-noir-mobile-audit-matrix
          path: screenshots
          if-no-files-found: error
          retention-days: 7
