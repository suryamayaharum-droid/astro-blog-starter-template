name: Relay HIVE Projections

on:
  push:
    branches:
      - ci/relay-hive-projections
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout relay snapshot
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render derived coordination projections
        working-directory: hive_validation
        run: python -m core.meaw.harum_projection_refresh

      - name: Verify projection watermark convergence
        working-directory: hive_validation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          jev=json.loads(Path(".harum-assembly/jev_view.json").read_text())
          event=jev.get("last_event")
          paths=[
              "state/coordination/dispatch_plan.json",
              "state/coordination/health.json",
              "state/coordination/meta_plan.json",
              "state/coordination/context_capsule.json",
              "state/coordination/capability_board.json",
          ]
          for path in paths:
              value=json.loads(Path(path).read_text())
              actual=value.get("source_last_event")
              if actual!=event:
                  raise SystemExit(f"watermark mismatch {path}: {actual!r} != {event!r}")
          print(f"projection watermark PASS: {event}")
          PY

      - name: Commit rendered projections to relay branch
        run: |
          git config user.name "harum-projection-relay"
          git config user.email "actions@users.noreply.github.com"
          git add             hive_validation/state/coordination/dispatch_plan.json             hive_validation/state/coordination/health.json             hive_validation/state/coordination/meta_plan.json             hive_validation/state/coordination/context_capsule.json             hive_validation/state/coordination/capability_board.json
          if git diff --cached --quiet; then
            echo "No projection changes"
            exit 0
          fi
          EVENT=$(python - <<'PY'
          import json
          print(json.load(open("hive_validation/.harum-assembly/jev_view.json"))["last_event"])
          PY
          )
          git commit -m "ci: render HIVE projections for ${EVENT}"
          git push origin HEAD:ci/relay-hive-projections
