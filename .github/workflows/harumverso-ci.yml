name: HARUM NOIR CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: harum-noir-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Astro + TypeScript
        run: npm run check

      - name: Bank actions and local model fallback contract
        run: node scripts/check_bank_controls.mjs

      - name: Cloudflare dry run
        run: npm run check:cloudflare

      - name: Internal route and asset links
        run: node scripts/check_internal_links.mjs
      - name: Reciprocal hreflang
        run: node scripts/check_hreflang.mjs
      - name: SEO metadata and JSON-LD surface
        run: node scripts/check_seo_surface.mjs

      - name: Discovery map and pre-launch contract
        run: node scripts/check_discovery_contract.mjs

      - name: Studio 23 ↔ Harum Noir ecosystem contract
        run: node scripts/check_ecosystem_contract.mjs

      - name: Custom-domain build and migration checks
        env:
          PUBLIC_SITE_URL: https://arteharum.com.br
        run: |
          npm run build
          node scripts/prepare_custom_domain.mjs
          node scripts/check_internal_links.mjs
          node scripts/check_hreflang.mjs
          node scripts/check_seo_surface.mjs
