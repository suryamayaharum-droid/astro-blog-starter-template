name: Deploy HARUM NOIR to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Astro + TypeScript
        run: npm run check
      - name: Bank controls and local AI contract
        run: node scripts/check_bank_controls.mjs
      - name: Build
        run: npm run build
      - name: Internal route and asset links
        run: node scripts/check_internal_links.mjs
      - name: Reciprocal hreflang
        run: node scripts/check_hreflang.mjs
      - name: SEO metadata and JSON-LD surface
        run: node scripts/check_seo_surface.mjs
      - name: Studio 23 ↔ Harum Noir ecosystem contract
        run: node scripts/check_ecosystem_contract.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
